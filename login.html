<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dairy Farm Portal</title>
  <meta name="description" content="Log in to your Dairy Farm management and subscription account.">
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%231b4332'><path d='M19 13v6a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-6a7 7 0 1 1 14 0z'/></svg>">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
  <link rel="stylesheet" type="text/css" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body style="margin: 0; padding: 0; overflow-y: auto;">
  <!-- Floating Action Buttons -->
  <div style="position: absolute; top: var(--space-4); inset-inline-end: var(--space-4); display: flex; gap: var(--space-2); z-index: 99;">
    <button type="button" class="btn-icon rtl-toggle-btn" aria-label="Toggle RTL Direction" title="Toggle RTL">
      <i class="ph-bold ph-arrows-left-right"></i>
    </button>
    <button type="button" class="btn-icon theme-toggle-btn" aria-label="Toggle Dark/Light Mode" title="Toggle Theme">
      <i class="ph-bold ph-moon"></i>
    </button>
  </div>

  <!-- Strictly centered layout - Vertically and horizontally - No scroll -->
  <!-- NO theme toggle | NO back-to-home button (Step 9.7) -->
  <div class="auth-page-wrapper">
    <div class="auth-card">
      
      <!-- Clickable Brand Logo -->
      <a href="index.html" style="display: flex; flex-direction: column; align-items: center; text-decoration: none; color: inherit; margin-block-end: var(--space-3); transition: opacity 0.2s ease;" onmouseover="this.style.opacity=0.8" onmouseout="this.style.opacity=1">
        <div class="auth-logo-badge" style="margin-block-end: 8px;">
          <i class="ph-bold ph-drop"></i>
        </div>
        <span style="font-family: var(--font-heading); font-weight: bold; font-size: 1.4rem; color: var(--color-text-main);">Dairy Farm</span>
      </a>

      <h1 class="auth-title">Welcome Back</h1>
      <p class="auth-subtitle">Log in to manage your dairy orders & farm operations</p>

      <!-- Client-side Validated Form -->
      <form class="auth-form" data-validate="true" data-success-msg="Login successful! Redirecting to farm dashboard..." novalidate>
        <div class="form-alert-box"></div>

        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address <span class="required-star">*</span></label>
          <input type="email" id="loginEmail" class="form-control" placeholder="you@dairyfarm.com" required autocomplete="email">
          <div class="invalid-feedback form-feedback">Please enter a valid email address.</div>
        </div>

        <div class="form-group">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-block-end: 8px;">
            <label for="password" style="margin: 0;">Password <span class="required-star">*</span></label>
            <a href="#" style="font-size: var(--size-caption); color: var(--color-primary); text-decoration: none;">Forgot?</a>
          </div>
          <input type="password" id="password" class="form-control" data-minlength="8" placeholder="Enter your password" required autocomplete="current-password">
          <div class="invalid-feedback form-feedback">Password must be at least 8 characters.</div>
        </div>

        <!-- Checkbox for Remember Me -->
        <div style="display: flex; align-items: center; gap: 8px; margin-block-start: 8px; margin-block-end: 16px;">
          <input type="checkbox" id="rememberMe" style="accent-color: var(--color-primary); width: 16px; height: 16px; cursor: pointer;">
          <label for="rememberMe" style="font-size: var(--size-caption); cursor: pointer; color: var(--color-text-muted); margin: 0;">Remember me</label>
        </div>

        <!-- Primary Action: strictly labeled "Login" -->
        <button type="submit" class="btn btn-primary" style="width: 100%;">
          Login
        </button>

        <div class="auth-divider">or continue with</div>

        <!-- Social Auth Buttons -->
        <div class="social-auth-buttons">
          <!-- Google Official SVG -->
          <button type="button" class="btn-social" onclick="window.location.href='dashboard.html'">
            <svg class="social-icon-svg" viewBox="0 0 24 24">
              <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
              <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
              <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
              <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
            </svg>
            Continue with Google
          </button>

          <!-- Apple Official SVG -->
          <button type="button" class="btn-social" onclick="window.location.href='dashboard.html'">
            <svg class="social-icon-svg" viewBox="0 0 24 24" fill="currentColor">
              <path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.81-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M15.97 6.87c.68-.82 1.13-1.97.99-3.11-1 .04-2.22.67-2.91 1.49-.6.69-1.13 1.83-.99 2.94 1.12.09 2.23-.52 2.91-1.32z"/>
            </svg>
            Continue with Apple
          </button>
        </div>

        <!-- Link to Register page -->
        <div class="auth-footer-nav">
          Don't have an account yet? <a href="register.html">Create an Account</a>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/main.js"></script>
</body>
</html>
